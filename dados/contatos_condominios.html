<title>Contatos de Condomínios · FTTA</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--paper:#0e1117;--ink:#e6e8e6;--mute:#8b949e;--line:#2a2f37;--fiber:#2bb39a;--ok:#3fb97a;--warn:#d9a441;--bad:#e5694f;--card:#161a22}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 'IBM Plex Sans',sans-serif}
.mono{font-family:'IBM Plex Mono',monospace}
header{padding:32px 32px 18px;border-bottom:2px solid var(--ink);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
h1{font:700 44px/0.95 'IBM Plex Sans Condensed';letter-spacing:-.5px;margin:0;text-transform:uppercase}
h1 span{color:var(--fiber)}
.sub{color:var(--mute);margin-top:8px;font-size:13px}
.kpis{display:flex;gap:0;border:1px solid var(--ink)}
.kpi{padding:10px 16px;border-right:1px solid var(--ink);min-width:104px;cursor:pointer}.kpi:last-child{border:0}
.kpi b{display:block;font:500 24px 'IBM Plex Mono'}.kpi small{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.kpi:hover{background:#1f2530}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 120px)}
aside{border-right:1px solid var(--line);padding:20px 20px 40px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
aside h3{font:700 12px 'IBM Plex Sans Condensed';text-transform:uppercase;letter-spacing:1px;margin:22px 0 8px;color:var(--mute)}
aside h3:first-child{margin-top:0}
input[type=search],select{width:100%;padding:9px 10px;border:1px solid var(--ink);background:var(--card);font:inherit;border-radius:0}
.chk{display:flex;align-items:center;justify-content:space-between;padding:4px 0;cursor:pointer;font-size:13px}
.chk input{accent-color:var(--fiber);margin-right:8px}.chk .n{font:12px 'IBM Plex Mono';color:var(--mute)}
.chk label{display:flex;align-items:center;cursor:pointer;flex:1}
button{font:500 13px 'IBM Plex Sans';padding:8px 12px;border:1px solid var(--ink);background:var(--card);cursor:pointer}
button.pri{background:var(--ink);color:var(--paper)}button:hover{background:var(--fiber);color:#0e1117;border-color:var(--fiber)}
main{padding:20px 28px 60px;min-width:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .count{font:500 13px 'IBM Plex Mono';margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--ink)}.seg button{border:0;border-right:1px solid var(--ink)}.seg button:last-child{border:0}
.seg button.on{background:var(--ink);color:var(--paper)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th{font:700 11px 'IBM Plex Sans Condensed';text-transform:uppercase;letter-spacing:.8px;text-align:left;padding:9px 10px;border-bottom:2px solid var(--ink);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--card)}
th:hover{color:var(--fiber)}th.s::after{content:' ↓'}th.s.asc::after{content:' ↑'}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#1b2029}
.cond{font-weight:600}.cond small{display:block;font:11px 'IBM Plex Mono';color:var(--mute);font-weight:400}
.tag{display:inline-block;font:600 11px 'IBM Plex Sans Condensed';text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border:1px solid currentColor}
.t-Síndico{color:var(--fiber)}.t-Administrador{color:#6f9be8}.t-Zelador{color:#d19a5a}.t-Porteiro{color:#b8bec6}.t-Outro{color:#888}.t-Lead{color:#d46bb0}
.tel{font-family:'IBM Plex Mono';white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.ok{background:var(--ok)}.fix{background:var(--warn)}.bad{background:var(--bad)}.none{background:var(--line)}
.st{font-size:11px;color:var(--mute);display:block}
a.wa{white-space:nowrap;color:var(--fiber);text-decoration:none;font-size:12px;font-weight:600;margin-left:6px}
.na{color:var(--mute);font-style:italic}
.muted{color:var(--mute);font-size:12px}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:14px;font:13px 'IBM Plex Mono'}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--ink)}
.card h4{margin:0;padding:12px 14px 4px;font:700 17px 'IBM Plex Sans Condensed';text-transform:uppercase}
.card .meta{padding:0 14px 10px;font:11px 'IBM Plex Mono';color:var(--mute);border-bottom:1px solid var(--line)}
.card ul{list-style:none;margin:0;padding:6px 14px 12px}.card li{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
.card li:last-child{border:0}
.drawer{position:fixed;inset:0 0 0 auto;width:420px;max-width:100%;background:var(--card);border-left:2px solid var(--ink);transform:translateX(100%);transition:.2s;z-index:9;overflow:auto;padding:24px}
.drawer.open{transform:none}.drawer dl{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px}.drawer dt{color:var(--mute);font-size:11px;text-transform:uppercase}
.drawer dd{margin:0;word-break:break-word}
@media(max-width:860px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}header{grid-template-columns:1fr}.kpis{flex-wrap:wrap}h1{font-size:32px}td.hm,th.hm{display:none}}
</style></head><body>
<header><div><h1>Contatos de <span>condomínios</span></h1><div class="sub">FTTA · síndicos, administradores, zeladores, porteiros e leads · consolidado de ficha, visita e leads</div></div><div class="kpis" id="kpis"></div></header>
<div class="layout">

<div style="margin-top:20px;display:flex;gap:8px"><button onclick="reset()">Limpar</button><button class="pri" onclick="exportCSV()">Exportar CSV</button></div>
</aside>
<main>
<div class="bar"><span class="count" id="count"></span><div class="seg"><button id="v_t" class="on" onclick="setView('t')">Tabela</button><button id="v_c" onclick="setView('c')">Por condomínio</button></div></div>
<div id="out"></div><div class="pager" id="pager"></div>
</main></div>
<div class="drawer" id="dr"></div>

const telHTML=r=>r.tels.map(x=>`<div style="margin-bottom:4px"><span class="tel"><span class="dot ok"></span>${fmt(x.t)}</span>${x.t.length===11?`<a class="wa" target="_blank" href="https://wa.me/55${x.t}">WhatsApp ↗</a>`:''}</div>`).join('')+(r.tels.length>1?`<span class="st">${r.tels.length} telefones</span>`:'');
const nm=r=>r.nome_contato==='n/a'?'<span class="na">n/a</span>':esc(r.nome_contato);
const cols=[['nome_condominio','Condomínio'],['nome_contato','Contato'],['tipo_contato','Tipo'],['telefone','Telefone'],['email','Email',1],['data_nascimento','Nasc.',1],['origens','Origem',1]];
function render(){const R=filt();counts();kpis(R);
R.sort((a,b)=>{const x=a[S.sort]||'\uffff',y=b[S.sort]||'\uffff';return (S.asc?1:-1)*x.localeCompare(y,'pt',{numeric:true})});
$('count').textContent=`${R.length} de ${D.length} contatos`;const P=50,pages=Math.ceil(R.length/P);
if(S.view==='t'){const pg=R.slice(S.page*P,S.page*P+P);
$('out').innerHTML=`<table><thead><tr>${cols.map(([k,l,h])=>`<th data-k="${k}" class="${h?'hm ':''}${S.sort===k?'s '+(S.asc?'asc':''):''}">${l}</th>`).join('')}</tr></thead><tbody>${pg.map((r,i)=>`<tr data-i="${D.indexOf(r)}" style="cursor:pointer">
<td class="cond">${esc(r.nome_condominio||'—')}<small>${esc(r.cep_numero||r.id_condominio)}</small></td>
<td>${nm(r)}${r.cargo_original&&r.tipo_contato.startsWith('Lead')?`<small class="st">${esc(r.cargo_original)}</small>`:''}</td>
<td><span class="tag ${tagc(r.tipo_contato)}">${esc(r.tipo_contato)}</span>${r.outros_tipos?`<small class="st">+ ${esc(r.outros_tipos)}</small>`:''}</td>
<td>${telHTML(r)}</td><td class="hm">${r.email?esc(r.email):'<span class="muted">—</span>'}</td><td class="hm mono">${r.data_nascimento?r.data_nascimento.split('-').reverse().join('/'):'<span class="muted">—</span>'}</td><td class="hm muted">${esc(r.origens)}</td></tr>`).join('')}</tbody></table>`;
document.querySelectorAll('th').forEach(t=>t.onclick=()=>{S.asc=S.sort===t.dataset.k?!S.asc:true;S.sort=t.dataset.k;render()});
document.querySelectorAll('tbody tr').forEach(t=>t.onclick=e=>{if(e.target.tagName!=='A')open_(D[t.dataset.i])});
$('pager').innerHTML=pages>1?`<button ${S.page?'':'disabled'} onclick="S.page--;render()">←</button> ${S.page+1} / ${pages} <button ${S.page<pages-1?'':'disabled'} onclick="S.page++;render()">→</button>`:'';}
else{const g=new Map();R.forEach(r=>{const k=r.id_condominio||r.cep_numero||'—';g.has(k)||g.set(k,[]);g.get(k).push(r)});
const ord=['Síndico','Administrador','Zelador','Porteiro','Outro','Lead (morador)'];
$('out').innerHTML=`<div class="grid">${[...g.values()].sort((a,b)=>b.length-a.length).map(L=>{L.sort((a,b)=>ord.indexOf(a.tipo_contato)-ord.indexOf(b.tipo_contato));const r0=L[0];return `<div class="card"><h4>${esc(r0.nome_condominio||'Sem nome')}</h4><div class="meta">${esc(r0.cep_numero||'sem CEP')} · ${L.length} contato${L.length>1?'s':''}</div><ul>${L.map(r=>`<li data-i="${D.indexOf(r)}" style="cursor:pointer"><span><span class="tag ${tagc(r.tipo_contato)}" style="font-size:10px">${esc(r.tipo_contato.replace(' (morador)',''))}</span> ${nm(r)}</span><span class="tel" style="font-size:12px">${fmt(r.tels[0].t)}${r.tels.length>1?` +${r.tels.length-1}`:''}</span></li>`).join('')}</ul></div>`}).join('')}</div>`;
document.querySelectorAll('.card li').forEach(t=>t.onclick=e=>{if(e.target.tagName!=='A')open_(D[t.dataset.i])});$('pager').innerHTML=''}}
function open_(r){const f=[['Condomínio',r.nome_condominio],['ID condomínio',r.id_condominio],['CEP_número',r.cep_numero],['Nome',r.nome_contato],['Tipo',r.tipo_contato],['Outros tipos',r.outros_tipos],['Cargo original',r.cargo_original],['Telefone',r.telefone],['Telefone 2',r.telefone_2],['Email',r.email],['Nascimento',r.data_nascimento],['Origens',r.origens],['Registros',r.qtd_registros],['Referências',r.referencias]];
$('dr').innerHTML=`<button onclick="$('dr').classList.remove('open')" style="float:right">Fechar ✕</button><h1 style="font-size:26px;margin:0 0 4px">${nm(r)}</h1><div class="sub" style="margin-bottom:18px"><span class="tag ${tagc(r.tipo_contato)}">${esc(r.tipo_contato)}</span></div>${telHTML(r)}<hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><dl>${f.map(([a,b])=>`<dt>${a}</dt><dd>${b?esc(b):'<span class="muted">—</span>'}</dd>`).join('')}</dl>`;$('dr').classList.add('open')}
document.onkeydown=e=>{if(e.key==='Escape')$('dr').classList.remove('open')};
function setView(v){S.view=v;$('v_t').classList.toggle('on',v==='t');$('v_c').classList.toggle('on',v==='c');render()}
function reset(){document.querySelectorAll('aside input[type=checkbox]').forEach(c=>c.checked=false);S.tipo.clear();S.tel.clear();S.org.clear();$('q').value='';$('cond').value='';S.page=0;render()}
function exportCSV(){const R=filt(),k=Object.keys(D[0]).filter(x=>!x.startsWith('_'));const csv=[k.join(';'),...R.map(r=>k.map(c=>'"'+String(r[c]).replace(/"/g,'""')+'"').join(';'))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='contatos_filtrados.csv';a.click()}
render();
</script></body></html>
